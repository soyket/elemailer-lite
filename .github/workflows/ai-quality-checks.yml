name: Quality checks

on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  syntax:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - php: '7.2'
            os: ubuntu-22.04
          - php: '8.3'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path '*/vendor/*' -not -path './lib/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  phpcs-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: composer install --no-interaction --no-progress
      - name: PHPCS on changed PHP files
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }}...HEAD -- '*.php' | grep -v '^helpers/vendor/' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs phpcs --report=summary
          else
            echo "No PHP files changed."
          fi
