name: Quality checks

on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path '*/vendor/*' -not -path './lib/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  phpcs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: composer install --no-interaction --no-progress
      - run: composer lint:phpcs
